<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chess with Rulers</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="board-area">
        <div id="board"></div>
        <div id="turn-light" title="Side to move">
            <span class="light"></span>
            <span class="light"></span>
        </div>
    </div>
    <p id="status"></p>
    <div id="promotion" hidden></div>
    <div id="controls">
        <button id="restart">New game</button>
        <button id="undo" title="Undo (Ctrl+Z)">Undo</button>
        <button id="flip">Flip board</button>
        <button id="sound"></button>
    </div>
    <details id="rules">
        <summary>Rules</summary>
        <form id="settings">
            <label><input type="checkbox" name="kingCapture"> King capture (off: standard checkmate)</label>
        </form>
    </details>

    <script type="module" src="src/ui.js"></script>
</body>
</html>
