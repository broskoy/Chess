<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chess with Rulers</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section id="menu">
        <div id="ruler-cards"></div>
        <button id="start-game">Start as the <span id="start-name">...</span></button>
    </section>

    <section id="game" hidden>
        <!-- Each player's row: ruler icon, material, ruler ability (grave or alchemy points).
             The player at the bottom also gets the Alchemist's conversion buttons. -->
        <div id="player-top" class="player-row">
            <span id="icon-top" class="slot ruler-icon"></span>
            <span id="material-top" class="slot material"></span>
            <span id="ability-top" class="slot ability"></span>
        </div>
        <div id="board-area">
            <div id="board"></div>
            <!-- General controls, the turn light, and a slot for items later -->
            <div id="side-bar">
                <div id="game-buttons">
                    <!-- Icons are drawn here (24 × 24 grid, stroked in the button's text color) -->
                    <button id="to-menu" class="icon-button" title="Main menu" aria-label="Main menu">
                        <svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg>
                    </button>
                    <button id="restart" class="icon-button" title="Restart" aria-label="Restart">
                        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
                    </button>
                    <button id="undo" class="icon-button" title="Undo (Ctrl+Z)" aria-label="Undo">
                        <svg viewBox="0 0 24 24"><path d="M9 5 4 10l5 5"/><path d="M4 10h11a5 5 0 0 1 0 10h-4"/></svg>
                    </button>
                    <button id="sound" class="icon-button">
                        <svg viewBox="0 0 24 24">
                            <path d="M11 5 6 9H3v6h3l5 4z"/>
                            <path class="sound-on" d="M15.5 8.5a5 5 0 0 1 0 7"/>
                            <path class="sound-on" d="M18.5 5.5a9 9 0 0 1 0 13"/>
                            <path class="sound-off" d="M3 3l18 18"/>
                        </svg>
                    </button>
                </div>
                <div id="turn-light" title="Side to move">
                    <span class="socket"></span>
                    <span class="socket"></span>
                    <span id="turn-marker"></span>
                </div>
                <span id="item-slot" class="slot" title="Items (coming later)"></span>
            </div>
        </div>
        <div id="player-bottom" class="player-row">
            <span id="icon-bottom" class="slot ruler-icon"></span>
            <span id="material-bottom" class="slot material"></span>
            <span id="ability-bottom" class="slot ability"></span>
            <div id="convert" class="choices" hidden></div>
            <div id="promotion" class="choices" hidden></div>
        </div>
    </section>

    <!-- Hidden until rulers are chosen on a home screen instead of mid-game -->
    <details id="rules" hidden>
        <summary>Rules</summary>
        <form id="settings">
            <label>White ruler
                <select name="whiteRuler">
                    <option value="king">King</option>
                    <option value="necromancer">Necromancer</option>
                    <option value="alchemist">Alchemist</option>
                </select>
            </label>
            <label>Black ruler
                <select name="blackRuler">
                    <option value="king">King</option>
                    <option value="necromancer">Necromancer</option>
                    <option value="alchemist">Alchemist</option>
                </select>
            </label>
            <label>Alchemist starting budget (new games)
                <select name="alchemistBudget" data-number>
                    <option value="0">0</option>
                    <option value="3">3</option>
                    <option value="5">5</option>
                    <option value="8">8</option>
                    <option value="12">12</option>
                </select>
            </label>
            <label><input type="checkbox" name="kingCapture"> King capture (off: standard checkmate)</label>
        </form>
    </details>

    <script type="module" src="src/ui.js"></script>
</body>
</html>
