<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chess with Rulers</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="ruler-top" class="ruler-label"></div>
    <div id="board-area">
        <div id="board"></div>
        <div id="side-bar">
            <div class="side-card">
                <span id="material-top" class="slot material"></span>
                <span id="ability-top" class="slot ability"></span>
            </div>
            <div id="turn-light" title="Side to move">
                <span class="socket"></span>
                <span class="socket"></span>
                <span id="turn-marker"></span>
            </div>
            <div class="side-card">
                <span id="ability-bottom" class="slot ability"></span>
                <span id="material-bottom" class="slot material"></span>
            </div>
        </div>
    </div>
    <div id="ruler-bottom" class="ruler-label"></div>
    <p id="status"></p>
    <div id="promotion" hidden></div>
    <div id="convert" hidden></div>
    <div id="controls">
        <button id="restart">New game</button>
        <button id="undo" title="Undo (Ctrl+Z)">Undo</button>
        <button id="flip">Flip board</button>
        <button id="sound"></button>
    </div>
    <details id="rules">
        <summary>Rules</summary>
        <form id="settings">
            <label>White ruler
                <select name="whiteRuler">
                    <option value="king">King</option>
                    <option value="necromancer">Necromancer</option>
                    <option value="alchemist">Alchemist</option>
                </select>
            </label>
            <label>Black ruler
                <select name="blackRuler">
                    <option value="king">King</option>
                    <option value="necromancer">Necromancer</option>
                    <option value="alchemist">Alchemist</option>
                </select>
            </label>
            <label>Alchemist starting budget (new games)
                <select name="alchemistBudget" data-number>
                    <option value="0">0</option>
                    <option value="3">3</option>
                    <option value="5">5</option>
                    <option value="8">8</option>
                    <option value="12">12</option>
                </select>
            </label>
            <label><input type="checkbox" name="kingCapture"> King capture (off: standard checkmate)</label>
        </form>
    </details>

    <script type="module" src="src/ui.js"></script>
</body>
</html>
